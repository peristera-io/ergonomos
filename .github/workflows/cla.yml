name: CLA

# Contributor License Agreement check via CLA Assistant (lite).
# Signatures are stored in this repo at signatures/cla.json, committed by the
# built-in GITHUB_TOKEN (hence contents: write). No external service needed.
#
# PUBLISH-TIME TODO:
#   * set `path-to-document` to the real CLA.md URL (OWNER/REPO below)
#   * add the repo owner to `allowlist` so their own PRs aren't gated
#   * pin `uses:` to the latest release (check the action's releases page)

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/OWNER/REPO/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thank you for your contribution! Before we can merge it, please read our CLA (CLA.md) and sign it by posting the comment below. You only need to do this once.'
